<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Plano Técnico Interactivo - Proyecto Ingler</title>
    <style>
        :root {
            --bg-color: #ecf0f1;
            --panel-color: #2c3e50;
            --accent-color: #e67e22;
            --text-color: #333333;
            --panel-text: #ffffff;
        }
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: row;
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* ================= ESTILOS MODO OSCURO ================= */
        body.dark-mode {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --text-color: #ffffff;
        }
        body.dark-mode svg { background-color: #1a1a1a !important; }
        body.dark-mode .txt-cota, body.dark-mode .txt-ambiente, body.dark-mode .txt-leyenda { fill: #ffffff !important; }
        body.dark-mode .txt-subtexto { fill: #cccccc !important; }
        body.dark-mode #cuadricula rect { stroke: #2a2a2a !important; }
        body.dark-mode .vano-limpio { fill: #1a1a1a !important; }
        body.dark-mode #capa-leyenda rect { fill: #242424 !important; stroke: #ffffff !important; }
        body.dark-mode #capa-entorno rect[fill="#e0e0e0"] { fill: #2d2d2d !important; stroke: #444444 !important; }
        
        /* Panel Lateral */
        #controles {
            width: 320px;
            flex-shrink: 0;
            background-color: var(--panel-color);
            color: var(--panel-text);
            padding: 20px;
            box-shadow: 3px 0 15px rgba(0,0,0,0.2);
            z-index: 9999;
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: background-color 0.3s ease;
        }
        #controles h2 { border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; font-size: 1.2rem; margin-top: 0; }
        #controles h3 { font-size: 14px; margin-top: 20px; color: #bdc3c7; border-bottom: 1px solid #34495e; padding-bottom: 5px; }
        
        .botones-grupo { display: flex; flex-direction: column; gap: 8px; }

        .btn-capa {
            width: 100%;
            padding: 12px;
            background: #34495e;
            border: 1px solid #2c3e50;
            color: white;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            touch-action: manipulation;
        }
        .btn-capa:hover { background: #415b76; }
        .btn-capa.activa { border-left: 5px solid var(--accent-color); background: #1a252f; }

        /* Botones de Navegación de Pisos */
        .btn-piso { background: #16a085; font-weight: bold; justify-content: center; }
        .btn-piso.activa { background: #27ae60; border-left: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }

        .btn-utilidad { background: #27ae60; border: 1px solid #1e8449; font-weight: bold; justify-content: center; }
        .btn-utilidad:hover { background: #2ecc71; }
        .btn-dark-toggle { background: #7f8c8d; border: 1px solid #626567; font-weight: bold; justify-content: center; }
        .btn-dark-toggle:hover { background: #95a5a6; }

        /* Contenedor del SVG */
        #lienzo {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: calc(100% - 320px);
            position: relative;
            z-index: 1;
            overflow: auto;
        }
        svg {
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-height: 95vh;
            width: auto;
            max-width: 100%;
            transition: background-color 0.3s ease;
        }
        
        /* Sistema de Capas SVG */
        .capa-svg { transition: opacity 0.3s ease; opacity: 1; }
        .capa-oculta { opacity: 0; pointer-events: none; display: none; }

        /* Estilos Internos del Plano */
        .plano-fondo { fill: url(#cuadricula); }
        .zona-social { fill: #fef9e7; fill-opacity: 0.85; }
        .zona-intima { fill: #f5eef8; fill-opacity: 0.85; }
        .zona-servicio { fill: #fadbd8; fill-opacity: 0.85; }
        .zona-exterior { fill: #e8f8f5; fill-opacity: 0.85; }
        .zona-circulacion { fill: #eaeded; fill-opacity: 0.85; }
        .muro-carga { fill: none; stroke: #2c3e50; stroke-width: 16; stroke-linecap: square; stroke-linejoin: miter; }
        .muro-alero { fill: none; stroke: #e67e22; stroke-width: 4; stroke-dasharray: 8,4; }
        .vano-limpio { fill: #ffffff; stroke: none; }
        .ventana-linea { fill: #eaf2f8; stroke: #2980b9; stroke-width: 4; }
        .ventana-vidrio { stroke: #3498db; stroke-width: 1; }
        .puerta-madera { fill: none; stroke: #d35400; stroke-width: 4; stroke-linecap: round; }
        .puerta-giro { fill: none; stroke: #e67e22; stroke-width: 1.5; stroke-dasharray: 5,4; }
        .escalera-escalon { fill: none; stroke: #34495e; stroke-width: 1.5; }
        .escalera-flecha { fill: none; stroke: #e74c3c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .cota-eje { stroke: #95a5a6; stroke-width: 1.5; fill: none; }
        .cota-proyeccion { stroke: #bdc3c7; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
        .txt-cota { fill: #2c3e50; font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; text-anchor: middle; }
        .txt-ambiente { fill: #2c3e50; font-family: 'Arial', sans-serif; font-size: 19px; font-weight: bold; text-anchor: middle; letter-spacing: 0.5px; }
        .txt-subtexto { fill: #626567; font-family: 'Arial', sans-serif; font-size: 14px; text-anchor: middle; }
        .txt-leyenda { fill: #2c3e50; font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; }
        .punto-vertice { fill: #e74c3c; stroke: #c0392b; stroke-width: 2; }
        .texto-vertice { fill: #c0392b; font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; }

        /* ================= MEDIA QUERIES iPHONE/SAFARI ================= */
        @media (max-width: 850px) {
            body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto !important; -webkit-overflow-scrolling: touch; }
            #lienzo { width: 100%; height: auto; min-height: 50vh; padding: 10px; order: 1; display: block; }
            svg { width: 100%; height: auto; max-height: 70vh; }
            #controles { width: 100%; order: 2; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top: 4px solid var(--accent-color); padding: 15px; display: block; }
            .botones-grupo { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
        }

        @media (max-width: 480px) {
            .botones-grupo { grid-template-columns: repeat(2, 1fr); }
        }

        /* ================= REGLAS DE IMPRESIÓN ================= */
        @media print {
            #controles { display: none !important; }
            body { background: white !important; color: black !important; display: block !important; height: auto !important; overflow: visible !important; }
            #lienzo { width: 100% !important; padding: 0 !important; display: block !important; height: auto !important; }
            svg { box-shadow: none !important; max-height: none !important; width: 100% !important; background-color: white !important; }
        }
    </style>
</head>

    <script>
        // Función general para capas
        function alternarCapa(idCapa, botonElemento) {
            const capa = document.getElementById(idCapa);
            if (capa.classList.contains('capa-oculta')) {
                capa.classList.remove('capa-oculta');
                botonElemento.classList.add('activa');
            } else {
                capa.classList.add('capa-oculta');
                botonElemento.classList.remove('activa');
            }
        }

        // LÓGICA DE SELECCIÓN DE PISO
        function seleccionarPiso(pisoNum) {
            const p1Group = document.getElementById('grupo-piso1');
            const p2Group = document.getElementById('grupo-piso2');
            const btnP1 = document.getElementById('btn-p1');
            const btnP2 = document.getElementById('btn-p2');
            const txtAlero = document.getElementById('txt-cota-alero');
            const leyArea = document.getElementById('leyenda-area');
            const leyTipo = document.getElementById('leyenda-tipo');
            const btnBañoControl = document.getElementById('btn-capa-baño-control');

            if (pisoNum === 1) {
                p1Group.classList.remove('capa-oculta');
                p2Group.classList.add('capa-oculta');
                btnP1.classList.add('activa');
                btnP2.classList.remove('activa');
                txtAlero.style.display = 'none';
                leyArea.textContent = 'Área Total P1: 119.00 m²';
                leyTipo.textContent = 'Tipo: Unifamiliar';
                
                // Habilitar control de baño P1
                btnBañoControl.style.display = 'flex';
                btnBañoControl.textContent = '🚽 Baño P1 (Bajo Escalera)';
            } else {
                p1Group.classList.add('capa-oculta');
                p2Group.classList.remove('capa-oculta');
                btnP1.classList.remove('activa');
                btnP2.classList.add('activa');
                txtAlero.style.display = 'block';
                leyArea.textContent = 'Área Total P2: 122.50 m²';
                leyTipo.textContent = 'Tipo: 2 Dptos Indep.';
                
                // Ocultar botón del baño P1 ya que el P2 tiene distribución propia fija
                btnBañoControl.style.display = 'none';
            }
        }

        function alternarModoOscuro(boton) {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                boton.textContent = '☀️ Modo Claro';
            } else {
                boton.textContent = '🌙 Modo Oscuro';
            }
        }

        function imprimirPlano() {
            window.print();
        }
    </script>
